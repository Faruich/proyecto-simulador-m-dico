<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de rehabilitación de extremidades</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #162433;
      --muted: #5c7085;
      --primary: #0b6efd;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #dce5ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #fee2e2;
      color: var(--danger);
    }

    .badge.connected {
      background: #dcfce7;
      color: #166534;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .seg-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .seg-btn.active {
      border-color: var(--primary);
      background: #e8f1ff;
      color: var(--primary);
    }

    .alert-box {
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .alert-box.connected {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }

    .movement-box {
      margin-top: 12px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 16px;
      text-align: center;
    }

    .movement-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--success);
    }

    .reps {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-reset {
      margin-top: 10px;
      background: #fee2e2;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Simulador de rehabilitación de extremidades</h1>
      <span id="connBadge" class="badge">ESP32 no conectado</span>
    </header>

    <section class="card">
      <div class="row">
        <button id="btnBrazo" class="seg-btn active" onclick="selectLimb('Brazo')">Brazo</button>
        <button id="btnRodilla" class="seg-btn" onclick="selectLimb('Rodilla')">Rodilla</button>
      </div>
    </section>

    <section class="card">
      <div id="espAlert" class="alert-box">
        ESP32 no conectado. Conecta el ESP32 para recibir movimientos.
      </div>

      <div id="movementDisplay" class="movement-box" style="display: none;">
        <div id="movementText" class="movement-title"></div>
        <div id="repsText" class="reps">Movimientos realizados: 0</div>
      </div>

      <button class="btn btn-reset" onclick="resetCount()">Reiniciar conteo</button>
    </section>

    <section class="card">
      <label for="topicInput">Canal MQTT</label>
      <input id="topicInput" type="text" value="simulador/medicina/as5600/evento" />
      <button class="btn btn-primary" onclick="connectESP32()">Conectar ESP32</button>
    </section>
  </div>

  <script>
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
    let client = null;
    let isConnected = false;
    let selectedLimb = "Brazo";
    let movementCount = 0;

    function selectLimb(limb) {
      selectedLimb = limb;
      document.getElementById("btnBrazo").classList.toggle("active", limb === "Brazo");
      document.getElementById("btnRodilla").classList.toggle("active", limb === "Rodilla");
    }

    function updateConnectionUI(connected) {
      isConnected = connected;
      const badge = document.getElementById("connBadge");
      const alertBox = document.getElementById("espAlert");

      if (connected) {
        badge.textContent = "ESP32 conectado";
        badge.className = "badge connected";
        alertBox.textContent = "ESP32 conectado. Esperando movimiento...";
        alertBox.className = "alert-box connected";
      } else {
        badge.textContent = "ESP32 no conectado";
        badge.className = "badge";
        alertBox.textContent = "ESP32 no conectado. Conecta el ESP32 para recibir movimientos.";
        alertBox.className = "alert-box";
        document.getElementById("movementDisplay").style.display = "none";
      }
    }

    function showMovement() {
      if (!isConnected) return;
      movementCount += 1;
      const display = document.getElementById("movementDisplay");
      display.style.display = "flex";
      document.getElementById("movementText").textContent = `Movimiento de ${selectedLimb} realizado`;
      document.getElementById("repsText").textContent = `Movimientos realizados: ${movementCount}`;
    }

    function resetCount() {
      movementCount = 0;
      document.getElementById("movementDisplay").style.display = "none";
      document.getElementById("repsText").textContent = "Movimientos realizados: 0";
    }

    function connectESP32() {
      const topic = document.getElementById("topicInput").value.trim();
      if (!topic) return;

      if (client) {
        client.end(true);
      }

      const clientId = "sim_ext_" + Math.random().toString(16).slice(2, 10);
      client = mqtt.connect(BROKER_WSS, {
        clientId,
        clean: true,
        connectTimeout: 5000
      });

      client.on("connect", () => {
        client.subscribe(topic);
        updateConnectionUI(true);
      });

      client.on("message", (_topic, payload) => {
        if (!isConnected) return;
        const msg = payload.toString().trim().toUpperCase();
        if (msg === "LLEGO_B" || msg === "MOVIMIENTO" || msg === "PRESENTE" || msg === "1") {
          showMovement();
        }
      });

      client.on("close", () => {
        updateConnectionUI(false);
      });

      client.on("offline", () => {
        updateConnectionUI(false);
      });

      client.on("error", () => {
        updateConnectionUI(false);
      });
    }
  </script>
</body>
</html>
