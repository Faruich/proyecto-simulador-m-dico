<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de rehabilitación de extremidades</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #162433;
      --muted: #5c7085;
      --primary: #0b6efd;
      --success: #16a34a;
      --danger: #dc2626;
      --warning-bg: #fef9c3;
      --warning-text: #854d0e;
      --border: #dce5ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #fee2e2;
      color: var(--danger);
    }

    .badge.connected {
      background: #dcfce7;
      color: #166534;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .seg-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .seg-btn.active {
      border-color: var(--primary);
      background: #e8f1ff;
      color: var(--primary);
    }

    .alert-box {
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .alert-box.connected {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }

    .alert-box.waiting {
      background: var(--warning-bg);
      color: var(--warning-text);
      border-color: #fde047;
    }

    .counter-panel {
      margin-top: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .counter-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }

    .counter-sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .movement-box {
      margin-top: 12px;
      min-height: 86px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 14px;
      text-align: center;
    }

    .movement-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--success);
    }

    .completed-banner {
      margin-top: 12px;
      display: none;
      padding: 14px;
      border-radius: 12px;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-success {
      margin-top: 10px;
      background: var(--success);
      color: #ffffff;
    }

    .btn-cancel {
      margin-top: 10px;
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-continue {
      margin-top: 10px;
      background: var(--primary);
      color: #ffffff;
    }

    .help-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -6px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Simulador de rehabilitación de extremidades</h1>
      <span id="connBadge" class="badge">ESP32 no conectado</span>
    </header>

    <!-- PANTALLA 1: Configuración de extremidad, repeticiones y botón Iniciar -->
    <section id="setupScreen" class="card">
      <div class="row">
        <button id="btnBrazo" class="seg-btn active" onclick="selectLimb('Brazo')">Brazo</button>
        <button id="btnRodilla" class="seg-btn" onclick="selectLimb('Rodilla')">Rodilla</button>
      </div>

      <div style="margin-top: 14px;">
        <label for="targetInput">Repeticiones indicadas (entero mayor que 1)</label>
        <input
          id="targetInput"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Ej. 5"
          oninput="sanitizeTargetInput(this)"
        />
        <div class="help-text">Solo números enteros mayores que 1 (sin letras ni símbolos).</div>
      </div>

      <button id="btnStart" class="btn btn-success" onclick="startSession()" disabled>Iniciar</button>
    </section>

    <!-- PANTALLA 2: Ejecución de movimientos / Completado -->
    <section id="sessionScreen" class="card" style="display: none;">
      <div id="espAlert" class="alert-box connected">
        ESP32 conectado. Realizando movimientos...
      </div>

      <div class="counter-panel">
        <div id="counterDisplay" class="counter-value">0 / 2</div>
        <div id="counterSub" class="counter-sub">Faltan 2 repeticiones</div>
      </div>

      <div id="movementDisplay" class="movement-box">
        <div id="movementText" class="movement-title"></div>
      </div>

      <div id="completedBanner" class="completed-banner">
        ¡Completado!
      </div>

      <button id="btnCancel" class="btn btn-cancel" onclick="cancelSession()">Cancelar</button>
      <button id="btnContinue" class="btn btn-continue" style="display: none;" onclick="continueAfterComplete()">Continuar</button>
    </section>

    <!-- Conexión MQTT -->
    <section class="card">
      <label for="topicInput">Canal MQTT</label>
      <input id="topicInput" type="text" value="simulador/medicina/as5600/evento" />
      <button id="btnConnect" class="btn btn-primary" onclick="sendConnectCommand()">Conectar ESP32</button>
    </section>
  </div>

  <script>
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_CONTROL = "simulador/medicina/as5600/control";

    let client = null;
    let isEspConnected = false;
    let sessionActive = false;
    let isCompleted = false;
    let selectedLimb = "Brazo";
    let movementCount = 0;
    let targetReps = 0;
    let ackTimeout = null;

    function selectLimb(limb) {
      selectedLimb = limb;
      document.getElementById("btnBrazo").classList.toggle("active", limb === "Brazo");
      document.getElementById("btnRodilla").classList.toggle("active", limb === "Rodilla");
      if (movementCount > 0) {
        document.getElementById("movementText").textContent = `Movimiento de ${selectedLimb} realizado`;
      }
      renderProgress();
    }

    function sanitizeTargetInput(inputEl) {
      const cleaned = inputEl.value.replace(/[^0-9]/g, "");
      if (inputEl.value !== cleaned) {
        inputEl.value = cleaned;
      }
      validateStartButton();
    }

    function getValidTargetValue() {
      const raw = document.getElementById("targetInput").value;
      if (!/^[0-9]+$/.test(raw)) return null;
      const num = parseInt(raw, 10);
      return num > 1 ? num : null;
    }

    function validateStartButton() {
      const validTarget = getValidTargetValue();
      document.getElementById("btnStart").disabled = !(isEspConnected && validTarget !== null);
    }

    function showScreen(mode) {
      const setupScreen = document.getElementById("setupScreen");
      const sessionScreen = document.getElementById("sessionScreen");

      if (mode === "session") {
        setupScreen.style.display = "none";
        sessionScreen.style.display = "block";
      } else {
        sessionScreen.style.display = "none";
        setupScreen.style.display = "block";
      }
    }

    function renderProgress() {
      const totalMostrar = targetReps > 1 ? targetReps : 0;
      document.getElementById("counterDisplay").textContent = `${movementCount} / ${totalMostrar}`;

      const banner = document.getElementById("completedBanner");
      const sub = document.getElementById("counterSub");
      const btnCancel = document.getElementById("btnCancel");
      const btnContinue = document.getElementById("btnContinue");

      if (isCompleted) {
        banner.style.display = "block";
        banner.textContent = `¡Completado! (${selectedLimb})`;
        sub.textContent = "Meta alcanzada";
        btnCancel.style.display = "none";
        btnContinue.style.display = "block";
      } else {
        banner.style.display = "none";
        btnCancel.style.display = "block";
        btnContinue.style.display = "none";
        const faltantes = Math.max(0, targetReps - movementCount);
        sub.textContent = `Faltan ${faltantes} ${faltantes === 1 ? "repetición" : "repeticiones"}`;
      }
    }

    function setEspConnectedState(connected, statusMsg = "") {
      clearTimeout(ackTimeout);
      isEspConnected = connected;

      const badge = document.getElementById("connBadge");
      const alertBox = document.getElementById("espAlert");

      if (connected) {
        badge.textContent = "ESP32 conectado";
        badge.className = "badge connected";
        alertBox.textContent = statusMsg || "ESP32 conectado. Realizando movimientos...";
        alertBox.className = "alert-box connected";
      } else {
        sessionActive = false;
        isCompleted = false;
        showScreen("setup");
        badge.textContent = "ESP32 no conectado";
        badge.className = "badge";
        alertBox.textContent = statusMsg || "ESP32 no conectado. Envía el comando de conexión para comenzar.";
        alertBox.className = "alert-box";
        document.getElementById("movementDisplay").style.display = "none";
        document.getElementById("completedBanner").style.display = "none";
      }

      validateStartButton();
    }

    function startSession() {
      const validTarget = getValidTargetValue();
      if (!isEspConnected || validTarget === null) return;

      targetReps = validTarget;
      movementCount = 0;
      sessionActive = true;
      isCompleted = false;

      document.getElementById("movementDisplay").style.display = "none";
      document.getElementById("completedBanner").style.display = "none";
      renderProgress();
      showScreen("session");

      if (client && client.connected()) {
        client.publish(TOPIC_CONTROL, `INICIAR:${targetReps}`);
      }
    }

    function cancelSession() {
      sessionActive = false;
      isCompleted = false;
      movementCount = 0;
      document.getElementById("movementDisplay").style.display = "none";
      document.getElementById("completedBanner").style.display = "none";
      showScreen("setup");

      if (client && client.connected()) {
        client.publish(TOPIC_CONTROL, "CANCELAR");
      }
    }

    function continueAfterComplete() {
      sessionActive = false;
      isCompleted = false;
      movementCount = 0;
      document.getElementById("movementDisplay").style.display = "none";
      document.getElementById("completedBanner").style.display = "none";
      showScreen("setup");

      if (client && client.connected()) {
        client.publish(TOPIC_CONTROL, "CONTINUAR");
      }
    }

    function showMovement() {
      if (!isEspConnected || !sessionActive || isCompleted) return;
      movementCount += 1;

      const display = document.getElementById("movementDisplay");
      display.style.display = "flex";
      document.getElementById("movementText").textContent = `Movimiento de ${selectedLimb} realizado`;

      if (movementCount >= targetReps) {
        isCompleted = true;
        sessionActive = false;
      }

      renderProgress();
    }

    function sendConnectCommand() {
      const topic = document.getElementById("topicInput").value.trim();
      if (!topic) return;

      setEspConnectedState(false, "Enviando comando de conexión al ESP32...");

      if (client) {
        client.end(true);
      }

      const clientId = "sim_ext_" + Math.random().toString(16).slice(2, 10);
      client = mqtt.connect(BROKER_WSS, {
        clientId,
        clean: true,
        connectTimeout: 5000
      });

      client.on("connect", () => {
        client.subscribe(topic, (err) => {
          if (err) {
            setEspConnectedState(false, "No se pudo suscribir al canal MQTT.");
            return;
          }
          client.publish(TOPIC_CONTROL, "CONECTAR_APP");

          ackTimeout = setTimeout(() => {
            if (!isEspConnected) {
              setEspConnectedState(false, "Sin respuesta del ESP32. Verifica que esté encendido y en línea.");
            }
          }, 6000);
        });
      });

      client.on("message", (_topic, payload) => {
        const msg = payload.toString().trim().toUpperCase();

        if (msg === "ESP32_LISTO") {
          setEspConnectedState(true, "ESP32 conectado. Ingresa las repeticiones y pulsa Iniciar.");
          return;
        }

        if (!isEspConnected || !sessionActive) return;

        if (msg === "LLEGO_B" || msg === "MOVIMIENTO" || msg === "PRESENTE" || msg === "1") {
          showMovement();
        }
      });

      client.on("close", () => {
        setEspConnectedState(false);
      });

      client.on("offline", () => {
        setEspConnectedState(false);
      });

      client.on("error", () => {
        setEspConnectedState(false, "Error de conexión con el broker MQTT.");
      });
    }

    validateStartButton();
    renderProgress();
  </script>
</body>
</html>
