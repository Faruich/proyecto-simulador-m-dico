<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de rehabilitación de extremidades</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #162433;
      --muted: #5c7085;
      --primary: #0b6efd;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #dce5ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #fee2e2;
      color: var(--danger);
    }

    .badge.connected {
      background: #dcfce7;
      color: #166534;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .seg-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .seg-btn.active {
      border-color: var(--primary);
      background: #e8f1ff;
      color: var(--primary);
    }

    .alert-box {
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .alert-box.connected {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }

    .counter-panel {
      margin-top: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .counter-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }

    .counter-sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .movement-box {
      margin-top: 12px;
      min-height: 100px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 16px;
      text-align: center;
    }

    .movement-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--success);
    }

    .completed-banner {
      margin-top: 12px;
      display: none;
      padding: 14px;
      border-radius: 12px;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-reset {
      margin-top: 10px;
      background: #fee2e2;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Simulador de rehabilitación de extremidades</h1>
      <span id="connBadge" class="badge">ESP32 no conectado</span>
    </header>

    <section class="card">
      <div class="row">
        <button id="btnBrazo" class="seg-btn active" onclick="selectLimb('Brazo')">Brazo</button>
        <button id="btnRodilla" class="seg-btn" onclick="selectLimb('Rodilla')">Rodilla</button>
      </div>

      <div style="margin-top: 14px;">
        <label for="targetInput">Repeticiones indicadas por la doctora</label>
        <input id="targetInput" type="number" min="1" max="500" value="5" oninput="updateTarget()" onchange="updateTarget()" />
      </div>
    </section>

    <section class="card">
      <div id="espAlert" class="alert-box">
        ESP32 no conectado. Conecta el ESP32 para recibir movimientos.
      </div>

      <div class="counter-panel">
        <div id="counterDisplay" class="counter-value">0 / 5</div>
        <div id="counterSub" class="counter-sub">Faltan 5 repeticiones</div>
      </div>

      <div id="movementDisplay" class="movement-box">
        <div id="movementText" class="movement-title"></div>
      </div>

      <div id="completedBanner" class="completed-banner">
        ¡Completado!
      </div>

      <button class="btn btn-reset" onclick="resetCount()">Reiniciar conteo</button>
    </section>

    <section class="card">
      <label for="topicInput">Canal MQTT</label>
      <input id="topicInput" type="text" value="simulador/medicina/as5600/evento" />
      <button class="btn btn-primary" onclick="connectESP32()">Conectar ESP32</button>
    </section>
  </div>

  <script>
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_CONTROL = "simulador/medicina/as5600/control";
    let client = null;
    let isConnected = false;
    let selectedLimb = "Brazo";
    let movementCount = 0;
    let targetReps = 5;
    let heartbeatInterval = null;

    function enviarControl(msg) {
      if (client && client.connected()) {
        client.publish(TOPIC_CONTROL, msg);
      }
    }

    function selectLimb(limb) {
      selectedLimb = limb;
      document.getElementById("btnBrazo").classList.toggle("active", limb === "Brazo");
      document.getElementById("btnRodilla").classList.toggle("active", limb === "Rodilla");
      if (movementCount > 0) {
        document.getElementById("movementText").textContent = `Movimiento de ${selectedLimb} realizado`;
      }
      renderProgress();
    }

    function updateTarget() {
      const val = parseInt(document.getElementById("targetInput").value, 10);
      if (!isNaN(val) && val >= 1) {
        targetReps = val;
      } else {
        targetReps = 1;
      }
      renderProgress();
      enviarControl(`META:${targetReps}`);
    }

    function renderProgress() {
      document.getElementById("counterDisplay").textContent = `${movementCount} / ${targetReps}`;

      const completed = movementCount >= targetReps;
      const banner = document.getElementById("completedBanner");
      const sub = document.getElementById("counterSub");

      if (completed) {
        banner.style.display = "block";
        banner.textContent = `¡Completado! (${selectedLimb})`;
        sub.textContent = "Meta alcanzada";
      } else {
        banner.style.display = "none";
        const faltantes = targetReps - movementCount;
        sub.textContent = `Faltan ${faltantes} ${faltantes === 1 ? "repetición" : "repeticiones"}`;
      }
    }

    function updateConnectionUI(connected) {
      isConnected = connected;
      const badge = document.getElementById("connBadge");
      const alertBox = document.getElementById("espAlert");

      if (!connected) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }

      if (connected) {
        badge.textContent = "ESP32 conectado";
        badge.className = "badge connected";
        alertBox.textContent = "ESP32 conectado. Esperando movimiento...";
        alertBox.className = "alert-box connected";
      } else {
        badge.textContent = "ESP32 no conectado";
        badge.className = "badge";
        alertBox.textContent = "ESP32 no conectado. Conecta el ESP32 para recibir movimientos.";
        alertBox.className = "alert-box";
        document.getElementById("movementDisplay").style.display = "none";
        document.getElementById("completedBanner").style.display = "none";
      }
    }

    function showMovement() {
      if (!isConnected) return;
      movementCount += 1;
      const display = document.getElementById("movementDisplay");
      display.style.display = "flex";
      document.getElementById("movementText").textContent = `Movimiento de ${selectedLimb} realizado`;
      renderProgress();
    }

    function resetCount() {
      movementCount = 0;
      document.getElementById("movementDisplay").style.display = "none";
      renderProgress();
      enviarControl("REINICIAR");
    }

    function connectESP32() {
      const topic = document.getElementById("topicInput").value.trim();
      if (!topic) return;

      if (client) {
        client.end(true);
      }

      const clientId = "sim_ext_" + Math.random().toString(16).slice(2, 10);
      client = mqtt.connect(BROKER_WSS, {
        clientId,
        clean: true,
        connectTimeout: 5000
      });

      client.on("connect", () => {
        client.subscribe(topic);
        updateConnectionUI(true);
        enviarControl(`META:${targetReps}`);
        clearInterval(heartbeatInterval);
        heartbeatInterval = setInterval(() => enviarControl("PING_APP"), 5000);
      });

      client.on("message", (_topic, payload) => {
        if (!isConnected) return;
        const msg = payload.toString().trim().toUpperCase();
        if (msg === "LLEGO_B" || msg === "MOVIMIENTO" || msg === "PRESENTE" || msg === "1") {
          showMovement();
        }
      });

      client.on("close", () => {
        updateConnectionUI(false);
      });

      client.on("offline", () => {
        updateConnectionUI(false);
      });

      client.on("error", () => {
        updateConnectionUI(false);
      });
    }

    renderProgress();
  </script>
</body>
</html>
